name: Game engine check

# What the daily run of a game repository does: the engine is not built from
# there, so a merge to Wargus/stratagus leaves the artifacts of the game
# master-builds release stale without anything in that repository changing. The
# schedule itself belongs to the game, because only a workflow can be scheduled;
# this is what it runs.
#
# The date of the engine master is compared with the date the newest artifact of
# the master-builds release went up. Dates rather than revisions, so a change can
# go unnoticed for a day, which is what it costs to avoid needing a token that is
# valid in the engine repository. Looking from the game rather than having the
# engine announce it is what keeps that true: workflow_dispatch events created
# with the token of a run do start runs in the same repository.

on:
  workflow_call:
    inputs:
      game_id:
        description: name of the game repository, whose master-builds release is checked
        required: true
        type: string

permissions:
  contents: read

jobs:
  engine-changed:
    name: Rebuild the master-builds artifacts when the engine moved
    runs-on: ubuntu-latest
    permissions:
      # to start the workflows that build the artifacts
      actions: write

    steps:
      - name: Check whether the engine moved since the artifacts went up
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game_id }}
        run: |
          set -e
          if ! engine=$(gh api repos/Wargus/stratagus/commits/master --jq .commit.committer.date); then
            echo "could not read the engine master, building"
            echo changed=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(gh api "repos/Wargus/$GAME/releases/tags/master-builds" \
            --jq '[.assets[].updated_at] | max' 2>/dev/null || true)
          if [ -z "$published" ] || [ "$published" = null ]; then
            echo "nothing is in the master-builds release yet, building"
            echo changed=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(date -d "$engine" +%s)" -gt "$(date -d "$published" +%s)" ]; then
            echo "the engine moved at $engine, the artifacts are from $published"
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo "the engine has not moved since the artifacts went up at $published"
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

      - name: Ask the workflows that build the artifacts to run
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On the default branch, which is where the artifacts come from. Those
          # workflows upload what they build to the master-builds release, so the
          # next run of this one is quiet again.
          for workflow in windows.yml ubuntu.yml macos.yml; do
            gh workflow run "$workflow" --ref master
          done
