name: windows

on:
  workflow_dispatch:
  push:
    # The branches filter is required: a tags filter on its own would stop
    # branch pushes, i.e. the daily installers. Tags are filtered so that only
    # version tags get a release.
    branches: ['**']
    tags: ['v*', '[0-9]*']
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/windows.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/windows.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: cmake --version
      run: cmake --version

    - name: build stratagus
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_VENDORED_LUA=ON -DBUILD_VENDORED_SDL=ON -DBUILD_VENDORED_MEDIA_LIBS=ON -DENABLE_STDIO_REDIRECT=ON -DBUILD_TESTING=1 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        cmake --build . --config Release

    - name: run tests
      run: |
        cd build
        ctest --output-on-failure

    # The games ship the installers players download, so what the engine
    # publishes is only its own binaries together with the debug symbols that
    # go with them: a crash log from any of the games can be analysed against
    # the matching engine build.
    - name: collect release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path release-assets | Out-Null
        $binaries = @(Get-ChildItem build/Release -File | Where-Object {
            $_.Extension -eq '.pdb' -or $_.Name -in 'stratagus.exe', 'stratagus-midiplayer.exe'
          } | ForEach-Object { $_.FullName })
        if ($binaries.Count -eq 0) {
          throw 'no executables or debug symbols to package'
        }
        Compress-Archive -Path $binaries -DestinationPath release-assets/compiled-binaries.zip
        Get-ChildItem release-assets | Format-Table Name, Length

    - name: Upload binaries and symbols
      uses: actions/upload-artifact@v7
      with:
        name: stratagus-release-assets
        path: release-assets/*
        retention-days: 90

    - name: Upload to the matching GitHub release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --exit-status --json tagName | Out-Null
          $found = $LASTEXITCODE -eq 0
          if (-not $found) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Stratagus $tag"
          }
        } else {
          $tag = 'master-builds'
        }
        $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
        gh release upload $tag --clobber $assets
